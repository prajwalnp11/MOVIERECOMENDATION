
apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-recommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-recommender
  template:
    metadata:
      labels:
        app: movie-recommender
    spec:
      containers:
        - name: movie-recommender
          image: prajwalnp11/movie-recommender:5b5ac02878e8493bd100618b888f6659cae04409
          ports:
            - containerPort: 8501
          env:
            - name: TMDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: movie-recommender-secret
                  key: TMDB_API_KEY
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
